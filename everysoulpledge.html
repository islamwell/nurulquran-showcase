فِى", "en": "in"}, {"ar": "ٱلنَّاقُورِ", "en": "the trumpet"}], "audio": "https://everyayah.com/data/Nasser_Alqatami_128kbps/074008.mp3"}, {"num": 9, "ar": "فَذَٰلِكَ يَوْمَئِذٍ يَوْمٌ عَسِيرٌ", "en": "That Day will be a difficult day", "words": [{"ar": "فَذَٰلِكَ", "en": "That"}, {"ar": "يَوْمَئِذٍ", "en": "Day"}, {"ar": "يَوْمٌ", "en": "(will be) a Day"}, {"ar": "عَسِيرٌ", "en": "difficult"}], "audio": "https://everyayah.com/data/Nasser_Alqatami_128kbps/074009.mp3"}, {"num": 10, "ar": "عَلَى ٱلْكَـٰفِرِينَ غَيْرُ يَسِيرٍ", "en": "For the disbelievers - not easy.", "words": [{"ar": "عَلَى", "en": "For"}, {"ar": "ٱلْكَـٰفِرِينَ", "en": "the disbelievers"}, {"ar": "غَيْرُ", "en": "not"}, {"ar": "يَسِيرٍ", "en": "easy"}], "audio": "https://everyayah.com/data/Nasser_Alqatami_128kbps/074010.mp3"}, {"num": 11, "ar": "ذَرْنِى وَمَنْ خَلَقْتُ وَحِيدًا", "en": "Leave Me with the one I created alone", "words": [{"ar": "ذَرْنِى", "en": "Leave Me"}, {"ar": "وَمَنْ", "en": "and whom"}, {"ar": "خَلَقْتُ", "en": "I created"}, {"ar": "وَحِيدًا", "en": "alone"}], "audio": "https://everyayah.com/data/Nasser_Alqatami_128kbps/074011.mp3"}, {"num": 12, "ar": "وَجَعَلْتُ لَهُۥ مَالًا مَمْدُودًا", "en": "And to whom I granted extensive wealth", "words": [{"ar": "وَجَعَلْتُ", "en": "And I granted"}, {"ar": "لَهُۥ", "en": "to him"}, {"ar": "مَالًا", "en": "wealth"}, {"ar": "مَمْدُودًا", "en": "extensive"}], "audio": "https://everyayah.com/data/Nasser_Alqatami_128kbps/074012.mp3"}, {"num": 13, "ar": "وَبَنِينَ شُهُودًا", "en": "And children present [with him]", "words": [{"ar": "وَبَنِينَ", "en": "And children"}, {"ar": "شُهُودًا", "en": "present"}], "audio": "https://everyayah.com/data/Nasser_Alqatami_128kbps/074013.mp3"}, {"num": 14, "ar": "وَمَهَّدتُّ لَهُۥ تَمْهِيدًا", "en": "And spread [everything] before him, easing [his life].", "words": [{"ar": "وَمَهَّدتُّ", "en": "And I spread"}, {"ar": "لَهُۥ", "en": "for him"}, {"ar": "تَمْهِيدًا", "en": "ease"}], "audio": "https://everyayah.com/data/Nasser_Alqatami_128kbps/074014.mp3"}, {"num": 15, "ar": "ثُمَّ يَطْمَعُ أَنْ أَزِيدَ", "en": "Then he desires that I should add more.", "words": [{"ar": "ثُمَّ", "en": "Then"}, {"ar": "يَطْمَعُ", "en": "he desires"}, {"ar": "أَنْ", "en": "that"}, {"ar": "أَزِيدَ", "en": "I (should) add more"}], "audio": "https://everyayah.com/data/Nasser_Alqatami_128kbps/074015.mp3"}, {"num": 16, "ar": "كَلَّآ إِنَّهُۥ كَانَ لِـَٔايَـٰتِنَا عَنِيدًا", "en": "No! Indeed, he has been toward Our verses obstinate.", "words": [{"ar": "كَلَّآ ", "en": "By no means"}, {"ar": "إِنَّهُۥ", "en": "Indeed, he"}, {"ar": "كَانَ", "en": "has been"}, {"ar": "لِـَٔايَـٰتِنَا", "en": "to Our Verses"}, {"ar": "عَنِيدًا", "en": "stubborn"}], "audio": "https://everyayah.com/data/Nasser_Alqatami_128kbps/074016.mp3"}, {"num": 17, "ar": "سَأُرْهِقُهُۥ صَعُودًا", "en": "I will cover him with arduous torment.", "words": [{"ar": "سَأُرْهِقُهُۥ", "en": "Soon I will cover Him"}, {"ar": "صَعُودًا", "en": "(with) a laborious punishment"}], "audio": "https://everyayah.com/data/Nasser_Alqatami_128kbps/074017.mp3"}, {"num": 18, "ar": "إِنَّهُۥ فَكَّرَ وَقَدَّرَ", "en": "Indeed, he thought and deliberated.", "words": [{"ar": "إِنَّهُۥ", "en": "Indeed, he"}, {"ar": "فَكَّرَ", "en": "thought"}, {"ar": "وَقَدَّرَ", "en": "and plotted"}], "audio": "https://everyayah.com/data/Nasser_Alqatami_128kbps/074018.mp3"}, {"num": 19, "ar": "فَقُتِلَ كَيْفَ قَدَّرَ", "en": "So may he be destroyed [for] how he deliberated.", "words": [{"ar": "فَقُتِلَ", "en": "So may he be destroyed"}, {"ar": "كَيْفَ", "en": "how"}, {"ar": "قَدَّرَ", "en": "he plotted"}], "audio": "https://everyayah.com/data/Nasser_Alqatami_128kbps/074019.mp3"}, {"num": 20, "ar": "ثُمَّ قُتِلَ كَيْفَ قَدَّرَ", "en": "Then may he be destroyed [for] how he deliberated.", "words": [{"ar": "ثُمَّ", "en": "Then"}, {"ar": "قُتِلَ", "en": "may he be destroyed"}, {"ar": "كَيْفَ", "en": "how"}, {"ar": "قَدَّرَ", "en": "he plotted"}], "audio": "https://everyayah.com/data/Nasser_Alqatami_128kbps/074020.mp3"}, {"num": 21, "ar": "ثُمَّ نَظَرَ", "en": "Then he considered [again];", "words": [{"ar": "ثُمَّ", "en": "Then"}, {"ar": "نَظَرَ", "en": "he looked"}], "audio": "https://everyayah.com/data/Nasser_Alqatami_128kbps/074021.mp3"}, {"num": 22, "ar": "ثُمَّ عَبَسَ وَبَسَرَ", "en": "Then he frowned and scowled;", "words": [{"ar": "ثُمَّ", "en": "Then"}, {"ar": "عَبَسَ", "en": "he frowned"}, {"ar": "وَبَسَرَ", "en": "and scowled"}], "audio": "https://everyayah.com/data/Nasser_Alqatami_128kbps/074022.mp3"}, {"num": 23, "ar": "ثُمَّ أَدْبَرَ وَٱسْتَكْبَرَ", "en": "Then he turned back and was arrogant", "words": [{"ar": "ثُمَّ", "en": "Then"}, {"ar": "أَدْبَرَ", "en": "he turned back"}, {"ar": "وَٱسْتَكْبَرَ", "en": "and was proud"}], "audio": "https://everyayah.com/data/Nasser_Alqatami_128kbps/074023.mp3"}, {"num": 24, "ar": "فَقَالَ إِنْ هَـٰذَآ إِلَّا سِحْرٌ يُؤْثَرُ", "en": "And said, \"This is not but magic imitated [from others].", "words": [{"ar": "فَقَالَ", "en": "Then he said"}, {"ar": "إِنْ", "en": "Not"}, {"ar": "هَـٰذَآ", "en": "(is) this"}, {"ar": "إِلَّا", "en": "but"}, {"ar": "سِحْرٌ", "en": "magic"}, {"ar": "يُؤْثَرُ", "en": "imitated"}], "audio": "https://everyayah.com/data/Nasser_Alqatami_128kbps/074024.mp3"}, {"num": 25, "ar": "إِنْ هَـٰذَآ إِلَّا قَوْلُ ٱلْبَشَرِ", "en": "This is not but the word of a human being.\"", "words": [{"ar": "إِنْ", "en": "Not"}, {"ar": "هَـٰذَآ", "en": "(is) this"}, {"ar": "إِلَّا", "en": "but"}, {"ar": "قَوْلُ", "en": "(the) word"}, {"ar": "ٱلْبَشَرِ", "en": "(of) a human being"}], "audio": "https://everyayah.com/data/Nasser_Alqatami_128kbps/074025.mp3"}, {"num": 26, "ar": "سَأُصْلِيهِ سَقَرَ", "en": "I will drive him into Saqar.", "words": [{"ar": "سَأُصْلِيهِ", "en": "Soon I will drive him"}, {"ar": "سَقَرَ", "en": "(into) Hell"}], "audio": "https://everyayah.com/data/Nasser_Alqatami_128kbps/074026.mp3"}, {"num": 27, "ar": "وَمَآ أَدْرَىٰكَ مَا سَقَرُ", "en": "And what can make you know what is Saqar?", "words": [{"ar": "وَمَآ", "en": "And what"}, {"ar": "أَدْرَىٰكَ", "en": "can make you know"}, {"ar": "مَا", "en": "what"}, {"ar": "سَقَرُ", "en": "(is) Hell"}], "audio": "https://everyayah.com/data/Nasser_Alqatami_128kbps/074027.mp3"}, {"num": 28, "ar": "لَا تُبْقِى وَلَا تَذَرُ", "en": "It lets nothing remain and leaves nothing [unburned],", "words": [{"ar": "لَا", "en": "Not"}, {"ar": "تُبْقِى", "en": "it lets remain"}, {"ar": "وَلَا", "en": "and not"}, {"ar": "تَذَرُ", "en": "it leaves"}], "audio": "https://everyayah.com/data/Nasser_Alqatami_128kbps/074028.mp3"}, {"num": 29, "ar": "لَوَّاحَةٌ لِلْبَشَرِ", "en": "Altering [i.e., blackening] the skins.", "words": [{"ar": "لَوَّاحَةٌ", "en": "Scorching"}, {"ar": "لِلْبَشَرِ", "en": "the human (skin)"}], "audio": "https://everyayah.com/data/Nasser_Alqatami_128kbps/074029.mp3"}, {"num": 30, "ar": "عَلَيْهَا تِسْعَةَ عَشَرَ", "en": "Over it are nineteen [angels].", "words": [{"ar": "عَلَيْهَا", "en": "Over it"}, {"ar": "تِسْعَةَ", "en": "(are) nine"}, {"ar": "عَشَرَ", "en": "teen"}], "audio": "https://everyayah.com/data/Nasser_Alqatami_128kbps/074030.mp3"}, {"num": 31, "ar": "وَمَا جَعَلْنَآ أَصْحَـٰبَ ٱلنَّارِ إِلَّا مَلَـٰٓئِكَةً وَمَا جَعَلْنَا عِدَّتَهُمْ إِلَّا فِتْنَةً لِلَّذِينَ كَفَرُوا لِيَسْتَيْقِنَ ٱلَّذِينَ أُوتُوا ٱلْكِتَـٰبَ وَيَزْدَادَ ٱلَّذِينَ ءَامَنُوٓا إِيمَـٰنًا وَلَا يَرْتَابَ ٱلَّذِينَ أُوتُوا ٱلْكِتَـٰبَ وَٱلْمُؤْمِنُونَ وَلِيَقُولَ ٱلَّذِينَ فِى قُلُوبِهِم مَرَضٌ وَٱلْكَـٰفِرُونَ مَاذَآ أَرَادَ ٱللَّهُ بِهَـٰذَا مَثَلًا كَذَٰلِكَ يُضِلُّ ٱللَّهُ مَن يَشَآءُ وَيَهْدِى مَن يَشَآءُ وَمَا يَعْلَمُ جُنُودَ رَبِّكَ إِلَّا هُوَ وَمَا هِىَ إِلَّا ذِكْرَىٰ لِلْبَشَرِ", "en": "And We have not made the keepers of the Fire except angels. And We have not made their number except as a trial for those who disbelieve - that those who were given the Scripture will be convinced and those who have believed will increase in faith and those who were given the Scripture and the believers wi function makeSprite(col) {
  const s = document.createElement('canvas'), g = s.getContext('2d');
  s.width = s.height = 24;
  const r = g.createRadialGradient(12, 12, 0, 12, 12, 12);
  r.addColorStop(0, '#ffffff');
  r.addColorStop(0.25, col);
  r.addColorStop(0.55, col + '66');
  r.addColorStop(0.85, col + '15');
  r.addColorStop(1, col + '00');
  g.fillStyle = r;
  g.fillRect(0, 0, 24, 24);
  return s;
}

let W, H, R, Z = 1, G = [0, 1], P = [], M = { x: -1e4, y: -1e4 }, T0 = 0, now = 0, wv = [];
let currentAyahIdx = 0;
let currentStageIdx = -1;
let stageStartTime = 0;
let userInteracted = false;
let isAnimPaused = false;
let pauseStartTime = 0;
let audioWasPlayingBeforePause = false;
const btnPauseAnim = document.getElementById('btnPauseAnim');

function isFullVerse() {
  return currentStageIdx >= (AYAHS[currentAyahIdx]?.words.length || 0);
}

function updatePauseUI() {
  if (!btnPauseAnim) return;
  btnPauseAnim.classList.toggle('active-pause', isAnimPaused);
  const iconPause = btnPauseAnim.querySelector('.icon-anim-pause');
  const iconPlay = btnPauseAnim.querySelector('.icon-anim-play');
  const textSpan = btnPauseAnim.querySelector('.pause-btn-text');
  if (iconPause) iconPause.style.display = isAnimPaused ? 'none' : 'inline-block';
  if (iconPlay) iconPlay.style.display = isAnimPaused ? 'inline-block' : 'none';
  if (textSpan) textSpan.textContent = isAnimPaused ? 'Resume' : 'Pause';
  btnPauseAnim.setAttribute('aria-label', isAnimPaused ? 'Resume animation' : 'Pause animation');
  btnPauseAnim.setAttribute('title', isAnimPaused ? 'Resume animation (P)' : 'Pause animation (P)');
  if (hint) {
    hint.textContent = isAnimPaused ? 'ANIMATION PAUSED · CLICK RESUME OR PRESS P TO CONTINUE' : 'HOLD TO PULL · TAP TO SCATTER · EACH RETURNS TO WHAT IT EARNED';
    hint.style.opacity = isAnimPaused ? .85 : (currentAyahIdx === 37 && isFullVerse() ? .65 : 0);
    hint.style.color = isAnimPaused ? '#5eead4' : 'rgba(94, 234, 212, 0.75)';
    hint.style.textShadow = isAnimPaused ? '0 0 12px rgba(94, 234, 212, 0.6)' : 'none';
  }
}

function togglePauseAnimation() {
  isAnimPaused = !isAnimPaused;
  if (isAnimPaused) {
    pauseStartTime = performance.now();
    if (isAudioPlaying && currentAudio && !currentAudio.paused) {
      currentAudio.pause();
      audioWasPlayingBeforePause = true;
    }
    sv.classList.add('paused-rings');
  } else {
    const pauseDuration = performance.now() - pauseStartTime;
    stageStartTime += pauseDuration;
    T0 += pauseDuration;
    if (audioWasPlayingBeforePause && currentAudio) {
      currentAudio.play().catch(() => {});
      audioWasPlayingBeforePause = false;
    }
    sv.classList.remove('paused-rings');
  }
  updatePauseUI();
}

if (btnPauseAnim) {
  btnPauseAnim.addEventListener('click', (e) => {
    e.stopPropagation();
    togglePauseAnimation();
  });
}


/* ───────── Populate Ayah Dropdown List ───────── */
function buildDropdownList(filter = '') {
  ayahDropdownList.innerHTML = '';
  const q = filter.trim().toLowerCase();
  AYAHS.forEach((ayah, idx) => {
    const matchesNum = String(ayah.num).includes(q);
    const matchesEn = ayah.en.toLowerCase().includes(q);
    const matchesAr = ayah.ar.includes(q);
    if (q && !matchesNum && !matchesEn && !matchesAr) return;

    const row = document.createElement('div');
    row.className = 'ayah-item' + (idx === currentAyahIdx ? ' active' : '');
    row.setAttribute('data-idx', idx);
    row.innerHTML = `
      <div class="ayah-item-badge">${ayah.num}</div>
      <div class="ayah-item-content">
        <div class="ayah-item-arabic">${ayah.ar}</div>
        <div class="ayah-item-english">${ayah.en}</div>
      </div>
    `;
    row.addEventListener('click', () => {
      selectAyah(idx);
      closeDropdown();
    });
    ayahDropdownList.appendChild(row);
  });
}

function openDropdown() {
  ayahDropdownWrap.classList.add('open');
  btnAyahDropdown.setAttribute('aria-expanded', 'true');
  ayahSearchInput.value = '';
  buildDropdownList();
  setTimeout(() => {
    ayahSearchInput.focus();
    const activeEl = ayahDropdownList.querySelector('.ayah-item.active');
    if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
  }, 50);
}

function closeDropdown() {
  ayahDropdownWrap.classList.remove('open');
  btnAyahDropdown.setAttribute('aria-expanded', 'false');
}

btnAyahDropdown.addEventListener('click', (e) => {
  e.stopPropagation();
  if (ayahDropdownWrap.classList.contains('open')) closeDropdown();
  else openDropdown();
});

ayahSearchInput.addEventListener('input', (e) => {
  buildDropdownList(e.target.value);
});

document.addEventListener('click', (e) => {
  if (!ayahDropdownWrap.contains(e.target)) closeDropdown();
});

function selectAyah(idx, keepAudio = true) {
  userInteracted = true;
  displayStage(idx, 0);
  if (isAudioPlaying && keepAudio) playAudioAyah(idx);
}

  if (words.length <= maxWords) return text;
  const lines = [];
  for (let i = 0; i < words.length; i += maxWords) {
    lines.push(words.slice(i, i + maxWords).join(' '));
  }
  return lines.join('\n');
}

function size() {
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || innerWidth < 768;
  const d = Math.min(devicePixelRatio || 1, isMobile ? 1.5 : 2);
  const m = Math.min(W = innerWidth, H = innerHeight) * .92;
  R = m * .425;
  c.width = W * d;
  c.height = H * d;
  c.style.width = W + 'px';
  c.style.height = H + 'px';
  x.setTransform(d, 0, 0, d, 0, 0);
  o.width = W;
  o.height = H;
  sv.style.width = sv.style.height = m + 'px';
  if (currentStageIdx >= 0) displayStage(currentAyahIdx, currentStageIdx, true);
}

function displayStage(ayahIdx, stageIdx, instant = false) {
  if (ayahIdx < 0 || ayahIdx >= AYAHS.length) return;
  const ayah = AYAHS[ayahIdx];
  const maxStage = ayah.words.length; // index maxStage is full ayah
  stageIdx = Math.max(0, Math.min(maxStage, stageIdx));

  currentAyahIdx = ayahIdx;
  currentStageIdx = stageIdx;
  stageStartTime = now;
  T0 = now;

  currentAyahBadge.textContent = ayah.num;
  document.querySelectorAll('.ayah-item').forEach((el, i) => {
    el.classList.toggle('active', parseInt(el.getAttribute('data-idx'), 10) === ayahIdx);
  });

  const isFull = stageIdx >= maxStage;
  sv.classList.toggle('lock', isFull);

  let a, e, k;
  const isPortrait = W < H * 1.2;

  if (isFull) {
    // Full Ayah in Radiant Celestial Color
    en.classList.add('full-ayah');
    const wordsCount = ayah.ar.split(' ').length;
    if (wordsCount > 10) {
      a = wrapArabic(ayah.ar, isPortrait ? 4 : 7);
      k = 0.38;
    } else if (wordsCount > 5) {
      a = wrapArabic(ayah.ar, isPortrait ? 3 : 5);
      k = 0.52;
    } else {
      a = ayah.ar;
      k = 0.68;
    }
    e = ayah.en;
  } else {
    // Word Animation in Warm Gold
    en.classList.remove('full-ayah');
    const w = ayah.words[stageIdx];
    a = w.ar;
    e = w.en;
    k = w.ar.length > 15 ? 0.75 : 0.95;
  }

  // Strip any tajweed annotations (small meem, pause marks, etc.)
  a = a.replace(/[\u06D6-\u06DC\u06DF-\u06E4\u06E7\u06E8\u06EA-\u06ED]/g, '');
  const L = a.split('\n'), q = [];
  ox.font = 100 + F;
  const mw = Math.max(10, ...L.map(l => ox.measureText(l).width));
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || W < 768;

  let fs;
  if (isFull) {
    const maxFullFs = Math.min(R * 0.46, isMobile ? 38 : 58);
    fs = Math.min(maxFullFs, Math.max(1.8 * R, Math.min(W * .82, 540)) * 100 / mw);
    fs = Math.max(isMobile ? 24 : 30, fs);
  } else {
    const maxWordFs = Math.min(R * 0.62, isMobile ? 80 : 120);
    fs = Math.min(maxWordFs, Math.max(1.8 * R, Math.min(W * .82, 540)) * 100 / mw);
    fs = Math.max(isMobile ? 38 : 50, fs);
  }
  const tw = Math.max(10, mw * fs / 100);
  const lineSpacing = isFull ? 1.68 : 1.52;
  
  // High Resolution: Sample every single pixel for ultra-crisp calligraphy
  const g = 1;
  G = [W / 2 + tw / 2, tw];
  Z = Math.min(1.0, .35 + fs / 110);

  ox.clearRect(0, 0, W, H);
  ox.font = fs + F;
  ox.textAlign = 'center';
  ox.textBaseline = 'middle';
  // Crystal-Clear Calligraphic rendering on offscreen canvas
  ox.fillStyle = isFull ? '#f0fdfa' : '#fff5db';
  L.forEach((l, j) => {
    const yPos = H / 2 + (j - (L.length - 1) / 2) * fs * lineSpacing;
    ox.fillText(l, W / 2, yPos);
  });

  const padX = Math.max(30, (fs * .5) | 0);
  const padY = Math.max(30, (fs * .75) | 0);
  const totalH = L.length * fs * lineSpacing;
  const rx0 = Math.max(0, ((W / 2 - tw / 2) - padX) | 0);
  const rx1 = Math.min(W, ((W / 2 + tw / 2) + padX) | 0);
  const ry0 = Math.max(0, ((H / 2 - totalH / 2 - fs * .5) - padY) | 0);
  const ry1 = Math.min(H, ((H / 2 + totalH / 2 + fs * .5) + padY) | 0);
  const rw = rx1 - rx0;
  const rh = ry1 - ry0;

  if (rw > 0 && rh > 0) {
    const d = ox.getImageData(rx0, ry0, rw, rh).data;
    for (let localY = 0; localY < rh; localY += g) {
      const rowOffset = localY * rw;
      for (let localX = 0; localX < rw; localX += g) {
        if (d[(rowOffset + localX) * 4 + 3] > 110) {
          q.push([rx0 + localX, ry0 + localY]);
        }
      }
    }
  }

  for (let j = q.length; j--;) {
    const r = Math.random() * (j + 1) | 0;
    [q[j], q[r]] = [q[r], q[j]];
  }

  const n = Math.min(q.length, P.length);
  P.forEach((p, j) => {
    if (p.on = j < n) {
      [p.tx, p.ty] = q[j];
      p.at = instant ? 0 : (now + ((G[0] - p.tx) / tw + (L.length > 1 && p.ty > H / 2)) * 1000 + Math.random() * 300);
      if (instant) {
        p.x = p.tx;
        p.y = p.ty;
        p.vx = p.vy = 0;
      }
    }
    if (!instant) {
      p.vx += (p.y - H / 2) * .025;
      p.vy -= (p.x - W / 2) * .025;
    }
  });

  en.innerHTML = `<span>${e}</span>`;
  hint.style.opacity = (ayahIdx === 37 && isFull) ? .65 : 0;

  if (!instant) {
    if (ayahIdx === 0 && stageIdx === 0) boom(W / 2, H / 2, 1, false);
    if (isFull) {
      boom(W / 2, H / 2, 1.25, true);
    }
  }
}

function boom(X, Y, w = 1, isFull = false) {
  wv.push([X, Y, now, isFull]);
  for (const p of P) {
    const dx = p.x - X, dy = p.y - Y, d = Math.hypot(dx, dy) + 1, f = Math.min(30, 3e3 / d) * w * (.5 + Math.random());
    p.vx += dx / d * f;
    p.vy += dy / d * f;
  }
}

function tick(t) {
  requestAnimationFrame(tick);
  now = t;
  const cx = W / 2, cy = H / 2, hold = M.p && t - M.t > 180, sx = G[0] + 200 - (t - T0) * .45 % (G[1] + 1400);

  const isFull = currentStageIdx >= (AYAHS[currentAyahIdx]?.words.length || 0);

  // Audio & Timer Sync (Skipped when animation is paused)
  if (!isAnimPaused && isAudioPlaying && currentAudio) {
    if (!currentAudio.paused && currentAudio.duration > 0) {
      const cur = currentAudio.currentTime;
      const dur = currentAudio.duration;
      const words = AYAHS[currentAyahIdx].words;
      const recitationRatio = 0.82;
      const wordSpan = (dur * recitationRatio) / words.length;
      let targetStage;
      if (cur < dur * recitationRatio) {
        targetStage = Math.min(words.length - 1, Math.floor(cur / wordSpan));
      } else {
        targetStage = words.length; // Full Ayah Reveal
      }
      if (targetStage !== currentStageIdx) {
        displayStage(currentAyahIdx, targetStage);
      }
    }
  } else if (!isAnimPaused && !userInteracted && currentStageIdx >= 0) {
    const ayah = AYAHS[currentAyahIdx];
    const waitTime = isFull ? 5800 : 3600;
    if (t - stageStartTime > waitTime) {
      if (!isFull) {
        displayStage(currentAyahIdx, currentStageIdx + 1);
      } else if (currentAyahIdx < AYAHS.length - 1) {
        displayStage(currentAyahIdx + 1, 0);
      }
    }
  }

  x.globalCompositeOperation = 'destination-out';
  x.globalAlpha = 1;
  x.fillStyle = 'rgba(0,0,0,.22)';
  x.fillRect(0, 0, W, H);

  // High-Definition Crisp Arabic Calligraphy
  if (currentStageIdx >= 0) {
    const progress = isAnimPaused ? 1 : Math.min(1, Math.max(0, (t - T0) / 750));
    
    // 1. Soft subtle outer glow
    x.globalCompositeOperation = 'lighter';
    x.globalAlpha = (isFull ? 0.32 : 0.26) * progress;
    x.drawImage(o, 0, 0, W, H);

    // 2. Crisp vector calligraphy core for effortless legibility
    x.globalCompositeOperation = 'source-over';
    x.globalAlpha = (isFull ? 0.85 : 0.90) * progress;
    x.drawImage(o, 0, 0, W, H);
  }

  // Active Sprites: Turquoise for Full Ayah, Gold for Words
  const activeSprites = isFull ? sprFull : sprWord;

  x.beginPath();
  for (const p of P) {
    const on = currentStageIdx >= 0 && p.on && (isAnimPaused || t > p.at);
    let tx = p.tx, ty = p.ty;
    if (!on) {
      p.a -= p.w * (isFull ? .1 : 1);
      const r = currentStageIdx < 0 ? p.s * (6 + 2 * Math.sin(t * .006)) : R * p.r * (1 + .02 * Math.sin(t * .001 + p.a * 3));
      tx = cx + Math.cos(p.a) * r;
      ty = cy + Math.sin(p.a) * r;
    }
    
    if (isAnimPaused) {
      // Freeze particles exactly on target when paused for zero jitter
      if (on) {
        p.x = tx;
        p.y = ty;
        p.vx = p.vy = 0;
      }
    } else {
      const k = on ? (hold ? .0015 : .026 * p.k) : currentStageIdx < 0 ? .005 : .012;
      const dx = p.x - M.x, dy = p.y - M.y, d = Math.hypot(dx, dy) + 1;
      p.vx += (tx - p.x) * k;
      p.vy += (ty - p.y) * k;
      if (hold) {
        p.vx += (dy * .8 - dx) / d * 1.1;
        p.vy -= (dy + dx * .8) / d * 1.1;
      } else if (d < 120) {
        p.vx += dx / d * (120 - d) / 30;
        p.vy += dy / d * (120 - d) / 30;
      }
      p.x += p.vx *= .85;
      p.y += p.vy *= .85;
    }

    if (on && Math.abs(p.x - tx) + Math.abs(p.y - ty) > 8) {
      x.moveTo(p.x, p.y);
      x.lineTo(tx, ty);
    }
    x.globalAlpha = on ? (.45 + .55 * Math.max(0, 1 - Math.abs(p.x - sx) / 60)) : (.25 + .2 * Math.sin(t * .003 + p.w * 4e3));
    const z = p.s * (isFull ? 2.3 : 2.1) * (on ? Z : 1);
    x.drawImage(activeSprites[p.c], p.x - z / 2, p.y - z / 2, z, z);
  }
  x.globalAlpha = 1;
  x.lineWidth = .6;
  x.strokeStyle = isFull ? 'rgba(94, 234, 212, 0.16)' : 'rgba(242,196,109,.08)';
  x.stroke();

  wv = wv.filter(([X, Y, s, waveIsFull]) => {
    const a = (t - s) / 1400;
    if (a < 1) {
      x.strokeStyle = waveIsFull ? `rgba(94, 234, 212, ${ .7 - .7 * a })` : `rgba(255, 226, 160, ${ .6 - .6 * a })`;
      x.lineWidth = 2 - 2 * a;
      x.beginPath();
      x.arc(X, Y, a * R * 1.3, 0, 7);
      x.stroke();
    }
    return a < 1;
  });

  x.globalCompositeOperation = 'source-over';
  x.strokeStyle = isFull ? '#5eead4' : '#f2c46d';
  x.lineWidth = 1;
  x.beginPath();
  x.arc(M.x, M.y, hold ? 5 : 12 + 2 * Math.sin(t * .005), 0, 7);
  x.stroke();
}

function resetExperience() {
  stopAudio();
  userInteracted = false;
  currentStageIdx = -1;
  en.innerHTML = '';
  hint.style.opacity = 0;
  sv.classList.remove('lock');
  setTimeout(() => displayStage(0, 0), 400);
}

onresize = size;
onpointermove = e => {
  M.x = e.clientX;
  M.y = e.clientY;
};
onpointerdown = e => {
  if (e.target.closest('button, a, .top-nav-bar, .exhibit-footer, .ayah-dropdown-panel')) return;
  onpointermove(e);
  M.p = 1;
  M.t = now;
};
onpointerup = e => {
  if (e.target.closest('button, a, .top-nav-bar, .exhibit-footer, .ayah-dropdown-panel')) return;
  M.p = 0;
  if (now - M.t < 180) boom(M.x, M.y, .7, currentStageIdx >= (AYAHS[currentAyahIdx]?.words.length || 0));
  if (e.pointerType !== 'mouse') M.x = M.y = -1e4;
};
ondblclick = e => {
  if (e.target.closest('button, a, .top-nav-bar, .exhibit-footer, .ayah-dropdown-panel')) return;
  resetExperience();
};

/* ───────── Recitation Audio Engine ───────── */
let currentAudio = null;
let currentAudioIdx = -1;
let isAudioPlaying = false;
let audioNextTimer = null;

function updateAudioUI(playing) {
  if (!audioBtn) return;
  audioBtn.classList.toggle('playing', playing);
  const iconPlay = audioBtn.querySelector('.icon-play');
  const iconPause = audioBtn.querySelector('.icon-pause');
  if (iconPlay) iconPlay.style.display = playing ? 'none' : 'inline-block';
  if (iconPause) iconPause.style.display = playing ? 'inline-block' : 'none';
  audioBtn.setAttribute('aria-label', playing ? 'Pause recitation' : 'Play recitation');
  const num = AYAHS[currentAyahIdx]?.num || 1;
  audioBtn.setAttribute('title', playing ? `Pause recitation (Ayah ${num})` : `Play recitation · Sheikh Nasser Al-Qatami (Ayah ${num})`);
}

function stopAudio() {
  if (audioNextTimer) {
    clearTimeout(audioNextTimer);
    audioNextTimer = null;
  }
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio.onended = null;
    currentAudio = null;
  }
  isAudioPlaying = false;
  updateAudioUI(false);
}

function playAudioAyah(idx) {
  if (audioNextTimer) {
    clearTimeout(audioNextTimer);
    audioNextTimer = null;
  }
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio.onended = null;
  }

  currentAudioIdx = idx;
  const audioUrl = AYAHS[idx].audio;
  currentAudio = new Audio(audioUrl);
  currentAudio.play().then(() => {
    isAudioPlaying = true;
    updateAudioUI(true);
  }).catch(err => {
    console.warn('Audio play error:', err);
    isAudioPlaying = false;
    updateAudioUI(false);
  });

  currentAudio.onended = () => {
    if (currentAudioIdx < AYAHS.length - 1) {
      audioNextTimer = setTimeout(() => {
        if (!isAudioPlaying) return;
        const nextIdx = currentAudioIdx + 1;
        displayStage(nextIdx, 0);
        playAudioAyah(nextIdx);
      }, 2000);
    } else {
      isAudioPlaying = false;
      updateAudioUI(false);
    }
  };
}

function toggleAudio() {
  if (isAudioPlaying) {
    stopAudio();
  } else {
    displayStage(currentAyahIdx, 0);
    playAudioAyah(currentAyahIdx);
  }
}

if (audioBtn) {
  audioBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleAudio();
  });
}

if (btnReplay) {
  btnReplay.addEventListener('click', () => {
    userInteracted = true;
    displayStage(currentAyahIdx, 0);
    if (isAudioPlaying) playAudioAyah(currentAyahIdx);
  });
}

if (btnFullVerse) {
  btnFullVerse.addEventListener('click', () => {
    userInteracted = true;
    displayStage(currentAyahIdx, AYAHS[currentAyahIdx].words.length);
  });
}

if (btnPrev) {
  btnPrev.addEventListener('click', () => {
    const prevIdx = (currentAyahIdx <= 0 ? AYAHS.length - 1 : currentAyahIdx - 1);
    selectAyah(prevIdx);
  });
}

if (btnNext) {
  btnNext.addEventListener('click', () => {
    const nextIdx = (currentAyahIdx >= AYAHS.length - 1 ? 0 : currentAyahIdx + 1);
    selectAyah(nextIdx);
  });
}

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    const nextIdx = (currentAyahIdx >= AYAHS.length - 1 ? 0 : currentAyahIdx + 1);
    selectAyah(nextIdx);
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    const prevIdx = (currentAyahIdx <= 0 ? AYAHS.length - 1 : currentAyahIdx - 1);
    selectAyah(prevIdx);
  } else if (e.key === ' ' && e.target === document.body) {
    e.preventDefault();
    toggleAudio();
  } else if (e.key === 'f' || e.key === 'F') {
    displayStage(currentAyahIdx, AYAHS[currentAyahIdx].words.length);
  } else if (e.key === 'p' || e.key === 'P') {
    togglePauseAnimation();
  } else if (e.key === 'r' || e.key === 'R') {
    displayStage(currentAyahIdx, 0);
  } else if (e.key === 'Escape') {
    closeDropdown();
  }
});

function initApp() {
  size();
  buildDropdownList();
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || W < 768;
  const maxP = isMobile ? 1800 : 4200;
  const minP = isMobile ? 800 : 2000;
  const targetP = Math.min(maxP, Math.max(minP, (W * H / (isMobile ? 320 : 220)) | 0));
  for (let i = targetP; i--; ) {
    P.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: 0,
      vy: 0,
      a: Math.random() * 7,
      w: .002 + Math.random() * .004,
      r: .95 + Math.random() * .1,
      s: 1.4 + Math.random() * 3,
      k: .6 + Math.random() * .8,
      c: Math.random() < .05 ? 3 : (Math.random() * 3) | 0
    });
  }
  now = performance.now();
  requestAnimationFrame(tick);

  const hash = location.hash.toLowerCase().replace('#', '');
  const targetNum = parseInt(hash, 10);
  if (!isNaN(targetNum) && targetNum >= 1 && targetNum <= AYAHS.length) {
    displayStage(targetNum - 1, 0);
  } else if (hash === 'snap' || hash === 'full') {
    document.body.classList.add('snap-mode');
    setTimeout(() => {
      displayStage(37, AYAHS[37].words.length, true); // Ayah 38 full
    }, 120);
  } else if (hash === 'dropdown') {
    displayStage(0, 0);
    setTimeout(openDropdown, 200);
  } else {
    setTimeout(() => displayStage(0, 0), 120);
  }
}

if (document.fonts && document.fonts.ready) {
  Promise.race([
    document.fonts.ready,
    new Promise(res => setTimeout(res, 900))
  ]).then(initApp).catch(initApp);
} else {
  window.addEventListener('DOMContentLoaded', initApp);
}
</script>
</body>

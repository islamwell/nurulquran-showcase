<script>
const c = document.querySelector('canvas'),
      x = c.getContext('2d'),
      o = document.createElement('canvas'),
      ox = o.getContext('2d', { willReadFrequently: true }),
      sv = document.getElementById('bgRings'),
      ref = document.getElementById('ref'),

      btnReplay = document.getElementById('btnReplay'),
      btnFullVerse = document.getElementById('btnFullVerse'),
      btnPrev = document.getElementById('btnPrev'),
      btnNext = document.getElementById('btnNext'),
      ayahPillBtns = document.querySelectorAll('.ayah-pill'),
      F = 'px "Amiri Quran",serif',
      AYAHS = [
        {
          num: 35,
          ref: 'سُورَةُ المُدَّثِّر · ٧٤:٣٥',
          audio: 'https://everyayah.com/data/Nasser_Alqatami_128kbps/074035.mp3',
          words: [
            { ar: 'إِنَّهَا', en: 'Indeed, it is', k: 0.95 },
            { ar: 'لَإِحْدَى', en: 'surely one of', k: 0.85 },
            { ar: 'الْكُبَرِ', en: 'the greatest [realities]', k: 0.85 }
          ],
          full: {
            ar: 'إِنَّهَا لَإِحْدَى الْكُبَرِ',
            arMobile: 'إِنَّهَا لَإِحْدَى الْكُبَرِ',
            en: 'Indeed, it is one of the greatest [realities]',
            enMobile: 'Indeed, it is one of<br>the greatest realities',
            k: 0.72
          }
        },
        {
          num: 36,
          ref: 'سُورَةُ المُدَّثِّر · ٧٤:٣٦',
          audio: 'https://everyayah.com/data/Nasser_Alqatami_128kbps/074036.mp3',
          words: [
            { ar: 'نَذِيرًا', en: 'A warning', k: 0.95 },
            { ar: 'لِّلْبَشَرِ', en: 'to all humanity', k: 0.85 }
          ],
          full: {
            ar: 'نَذِيرًا لِّلْبَشَرِ',
            arMobile: 'نَذِيرًا لِّلْبَشَرِ',
            en: 'A warning to all humanity',
            enMobile: 'A warning to all humanity',
            k: 0.80
          }
        },
        {
          num: 37,
          ref: 'سُورَةُ المُدَّثِّر · ٧٤:٣٧',
          audio: 'https://everyayah.com/data/Nasser_Alqatami_128kbps/074037.mp3',
          words: [
            { ar: 'لِمَن شَاءَ', en: 'For whoever wills', k: 0.85 },
            { ar: 'مِنكُمْ', en: 'among you', k: 0.90 },
            { ar: 'أَن يَتَقَدَّمَ', en: 'to advance', k: 0.80 },
            { ar: 'أَوْ يَتَأَخَّرَ', en: 'or lag behind', k: 0.80 }
          ],
          full: {
            ar: 'لِمَن شَاءَ مِنكُمْ أَن يَتَقَدَّمَ أَوْ يَتَأَخَّرَ',
            arMobile: 'لِمَن شَاءَ مِنكُمْ\nأَن يَتَقَدَّمَ أَوْ يَتَأَخَّرَ',
            en: 'For whoever among you chooses to advance or lag behind',
            enMobile: 'For whoever among you chooses<br>to advance or lag behind',

          }
        },
        {
          num: 38,
          ref: 'سُورَةُ المُدَّثِّر · ٧٤:٣٨',
          audio: 'https://everyayah.com/data/Nasser_Alqatami_128kbps/074038.mp3',
          words: [
            { ar: 'كُلُّ', en: 'Every', k: 1.0 },
            { ar: 'نَفْسٍۭ', en: 'soul', k: 0.75 },
            { ar: 'بِمَا كَسَبَتْ', en: 'for what it has earned', k: 0.60 },

          ],

            en: 'Every soul, for what it has earned, is held in pledge',

          }

      ],
      spr = ['#fff4dc', '#f2c46d', '#e0913f', '#7fe3d4'].map(k => {
        const s = document.createElement('canvas'), g = s.getContext('2d');
        s.width = s.height = 32;
        const r = g.createRadialGradient(16, 16, 0, 16, 16, 16);
        [[0, ''], [.18, 'bb'], [.45, '22'], [1, '00']].forEach(([v, a]) => r.addColorStop(v, k + a));

let W, H, R, Z = 1, G = [0, 1], P = [], M = { x: -1e4, y: -1e4 }, T0 = 0, now = 0, wv = [];
let currentAyahIdx = 0;
let currentStageIdx = -1;
let stageStartTime = 0;
let userInteracted = false;

function size() {
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || innerWidth < 768;
  const d = Math.min(devicePixelRatio || 1, isMobile ? 1.5 : 2);
  const m = Math.min(W = innerWidth, H = innerHeight) * .92;
  R = m * .425;
  c.width = W * d;
  c.height = H * d;
  c.style.width = W + 'px';
  c.style.height = H + 'px';
  x.setTransform(d, 0, 0, d, 0, 0);
  o.width = W;
  o.height = H;
  sv.style.width = sv.style.height = m + 'px';
  if (currentStageIdx >= 0) displayStage(currentAyahIdx, currentStageIdx, true);
}

function updatePills(idx) {
  ayahPillBtns.forEach((btn, i) => {
    btn.classList.toggle('active', i === idx);
    btn.setAttribute('aria-selected', i === idx ? 'true' : 'false');
  });
}

function displayStage(ayahIdx, stageIdx, instant = false) {
  if (ayahIdx < 0 || ayahIdx >= AYAHS.length) return;
  const ayah = AYAHS[ayahIdx];
  const maxStage = ayah.words.length; // maxStage is full ayah
  stageIdx = Math.max(0, Math.min(maxStage, stageIdx));

  currentAyahIdx = ayahIdx;
  currentStageIdx = stageIdx;
  stageStartTime = now;
  T0 = now;

  updatePills(ayahIdx);
  ref.textContent = ayah.ref;

  const isFull = stageIdx >= maxStage;
  sv.classList.toggle('lock', isFull);

  const isPortrait = W < H * 1.2;
  let a, e, k;
  if (isFull) {
    a = (isPortrait && ayah.full.arMobile) ? ayah.full.arMobile : ayah.full.ar;
    e = (isPortrait && ayah.full.enMobile) ? ayah.full.enMobile : ayah.full.en;
    k = ayah.full.k;
  } else {
    const w = ayah.words[stageIdx];
    a = w.ar;
    e = w.en;
    k = w.k;
  }

  const L = a.split('\n'), q = [];
  ox.font = 100 + F;
  const mw = Math.max(10, ...L.map(l => ox.measureText(l).width));
  const fs = Math.min(R * k, Math.max(1.9 * R, Math.min(W * .8, 520)) * 100 / mw);
  const tw = Math.max(10, mw * fs / 100);
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || W < 768;
  const g = isMobile ? 2 : (fs < 65 ? 1 : 2);
  G = [W / 2 + tw / 2, tw];
  Z = Math.min(1, .3 + fs / 100);

  ox.clearRect(0, 0, W, H);
  ox.font = fs + F;
  ox.textAlign = 'center';
  ox.fillStyle = '#f2c46d';
  L.forEach((l, j) => {
    const b = ox.measureText(l);
    const asc = b.actualBoundingBoxAscent || fs * .75;
    const desc = b.actualBoundingBoxDescent || 0;
    ox.fillText(l, W / 2, H / 2 + (j - (L.length - 1) / 2) * fs * 1.5 + (asc - desc) / 2);
  });

  const padX = Math.max(30, (fs * .5) | 0);
  const padY = Math.max(30, (fs * .75) | 0);
  const totalH = L.length * fs * 1.5;
  const rx0 = Math.max(0, ((W / 2 - tw / 2) - padX) | 0);
  const rx1 = Math.min(W, ((W / 2 + tw / 2) + padX) | 0);
  const ry0 = Math.max(0, ((H / 2 - totalH / 2 - fs * .5) - padY) | 0);
  const ry1 = Math.min(H, ((H / 2 + totalH / 2 + fs * .5) + padY) | 0);
  const rw = rx1 - rx0;
  const rh = ry1 - ry0;

  if (rw > 0 && rh > 0) {
    const d = ox.getImageData(rx0, ry0, rw, rh).data;
    for (let localY = 0; localY < rh; localY += g) {
      const rowOffset = localY * rw;
      for (let localX = 0; localX < rw; localX += g) {
        if (d[(rowOffset + localX) * 4 + 3] > 128) {
          q.push([rx0 + localX, ry0 + localY]);
        }
      }
    }
  }

  for (let j = q.length; j--;) {
    const r = Math.random() * (j + 1) | 0;
    [q[j], q[r]] = [q[r], q[j]];
  }

  const n = Math.min(q.length, P.length * .85 | 0);
  P.forEach((p, j) => {
    if (p.on = j < n) {
      [p.tx, p.ty] = q[j];
      p.at = instant ? 0 : (now + ((G[0] - p.tx) / tw + (L.length > 1 && p.ty > H / 2)) * 1000 + Math.random() * 300);
      if (instant) {
        p.x = p.tx;
        p.y = p.ty;
        p.vx = p.vy = 0;
      }
    }
    if (!instant) {
      p.vx += (p.y - H / 2) * .025;
      p.vy -= (p.x - W / 2) * .025;
    }
  });

  en.innerHTML = `<span>${e}</span>`;
  hint.style.opacity = (ayahIdx === 3 && isFull) ? .6 : 0;

  if (!instant) {
    if (ayahIdx === 0 && stageIdx === 0) boom(W / 2, H / 2);
    if (isFull) {
      boom(W / 2, H / 2, ayahIdx === 3 ? 1.2 : 0.85);
      if (ayahIdx === 3) setTimeout(() => { if (currentAyahIdx === 3 && currentStageIdx === 4) boom(W / 2, H / 2, 1.4); }, 2800);
    }
  }
}

function boom(X, Y, w = 1) {
  wv.push([X, Y, now]);
  for (const p of P) {
    const dx = p.x - X, dy = p.y - Y, d = Math.hypot(dx, dy) + 1, f = Math.min(30, 3e3 / d) * w * (.5 + Math.random());
    p.vx += dx / d * f;
    p.vy += dy / d * f;
  }
}

function tick(t) {
  requestAnimationFrame(tick);
  now = t;
  const cx = W / 2, cy = H / 2, hold = M.p && t - M.t > 180, sx = G[0] + 200 - (t - T0) * .45 % (G[1] + 1400);

  // Auto progression:
  if (isAudioPlaying && currentAudioIdx >= 0 && audioClips[currentAudioIdx]) {
    const aud = audioClips[currentAudioIdx];
    if (!aud.paused && aud.duration > 0) {
      const cur = aud.currentTime;
      const dur = aud.duration;
      const words = AYAHS[currentAyahIdx].words;
      const recitationRatio = 0.82;
      const wordSpan = (dur * recitationRatio) / words.length;
      let targetStage;
      if (cur < dur * recitationRatio) {
        targetStage = Math.min(words.length - 1, Math.floor(cur / wordSpan));
      } else {
        targetStage = words.length; // Full Ayah
      }
      if (targetStage !== currentStageIdx) {
        displayStage(currentAyahIdx, targetStage);
      }
    }
  } else if (!userInteracted && currentStageIdx >= 0) {
    const ayah = AYAHS[currentAyahIdx];
    const isFull = currentStageIdx >= ayah.words.length;
    const waitTime = isFull ? 5200 : 3200;
    if (t - stageStartTime > waitTime) {
      if (!isFull) {
        displayStage(currentAyahIdx, currentStageIdx + 1);
      } else if (currentAyahIdx < AYAHS.length - 1) {
        displayStage(currentAyahIdx + 1, 0);
      }
    }
  }

  x.globalCompositeOperation = 'destination-out';
  x.globalAlpha = 1;
  x.fillStyle = 'rgba(0,0,0,.2)';
  x.fillRect(0, 0, W, H);

  x.globalCompositeOperation = 'lighter';
  if (currentStageIdx >= 0) {
    x.globalAlpha = Math.min(1, Math.max(0, (t - T0) / 1500 - .8)) * .025;
    x.drawImage(o, 0, 0, W, H);
  }

  x.beginPath();
  for (const p of P) {
    const on = currentStageIdx >= 0 && p.on && t > p.at;
    let tx = p.tx, ty = p.ty;
    if (!on) {
      p.a -= p.w * (currentAyahIdx === 3 && currentStageIdx >= 4 ? .1 : 1);
      const r = currentStageIdx < 0 ? p.s * (6 + 2 * Math.sin(t * .006)) : R * p.r * (1 + .02 * Math.sin(t * .001 + p.a * 3));
      tx = cx + Math.cos(p.a) * r;
      ty = cy + Math.sin(p.a) * r;
    }
    const k = on ? (hold ? .0015 : .022 * p.k) : currentStageIdx < 0 ? .005 : .012;
    const dx = p.x - M.x, dy = p.y - M.y, d = Math.hypot(dx, dy) + 1;
    p.vx += (tx - p.x) * k;
    p.vy += (ty - p.y) * k;
    if (hold) {
      p.vx += (dy * .8 - dx) / d * 1.1;
      p.vy -= (dy + dx * .8) / d * 1.1;
    } else if (d < 120) {
      p.vx += dx / d * (120 - d) / 30;
      p.vy += dy / d * (120 - d) / 30;
    }
    p.x += p.vx *= .88;
    p.y += p.vy *= .88;
    if (on && Math.abs(p.x - tx) + Math.abs(p.y - ty) > 8) {
      x.moveTo(p.x, p.y);
      x.lineTo(tx, ty);
    }
    x.globalAlpha = on ? .45 + .55 * Math.max(0, 1 - Math.abs(p.x - sx) / 60) : .25 + .2 * Math.sin(t * .003 + p.w * 4e3);
    const z = p.s * 3.4 * (on ? Z : 1);
    x.drawImage(spr[p.c], p.x - z / 2, p.y - z / 2, z, z);
  }
  x.globalAlpha = 1;
  x.lineWidth = .6;
  x.strokeStyle = 'rgba(242,196,109,.08)';
  x.stroke();

  wv = wv.filter(([X, Y, s]) => {
    const a = (t - s) / 1400;
    if (a < 1) {
      x.strokeStyle = `rgba(255,226,160,${.6 - .6 * a})`;
      x.lineWidth = 2 - 2 * a;
      x.beginPath();
      x.arc(X, Y, a * R * 1.3, 0, 7);
      x.stroke();
    }
    return a < 1;
  });

  x.globalCompositeOperation = 'source-over';
  x.strokeStyle = '#f2c46d';
  x.lineWidth = 1;
  x.beginPath();
  x.arc(M.x, M.y, hold ? 5 : 12 + 2 * Math.sin(t * .005), 0, 7);
  x.stroke();
}

function resetExperience() {
  stopAllAudio();
  isAudioPlaying = false;
  updateAudioUI(false);
  userInteracted = false;
  currentStageIdx = -1;
  en.innerHTML = '';
  hint.style.opacity = 0;
  sv.classList.remove('lock');
  ref.textContent = 'سُورَةُ المُدَّثِّر · ٧٤:٣٥-٣٨';
  updatePills(-1);
  setTimeout(() => displayStage(0, 0), 400);
}

onresize = size;
onpointermove = e => {
  M.x = e.clientX;
  M.y = e.clientY;
};
onpointerdown = e => {
  if (e.target.closest('button, a, .top-nav-bar, .exhibit-footer')) return;
  onpointermove(e);
  M.p = 1;
  M.t = now;
};
onpointerup = e => {
  if (e.target.closest('button, a, .top-nav-bar, .exhibit-footer')) return;
  M.p = 0;
  if (now - M.t < 180) boom(M.x, M.y, .7);
  if (e.pointerType !== 'mouse') M.x = M.y = -1e4;
};
ondblclick = e => {
  if (e.target.closest('button, a, .top-nav-bar, .exhibit-footer')) return;
  resetExperience();
};

/* ───────── Continuous Audio by Sheikh Nasser Al-Qatami ───────── */
const audioClips = AYAHS.map(item => new Audio(item.audio));
let currentAudioIdx = -1;
let isAudioPlaying = false;
let audioAdvanceTimeout = null;

function updateAudioUI(playing) {
  if (!audioBtn) return;
  audioBtn.classList.toggle('playing', playing);
  const iconPlay = audioBtn.querySelector('.icon-play');
  const iconPause = audioBtn.querySelector('.icon-pause');
  if (iconPlay) iconPlay.style.display = playing ? 'none' : 'inline-block';
  if (iconPause) iconPause.style.display = playing ? 'inline-block' : 'none';
  audioBtn.setAttribute('aria-label', playing ? 'Pause recitation' : 'Play recitation');
  const curNum = (currentAyahIdx >= 0 && currentAyahIdx < AYAHS.length) ? AYAHS[currentAyahIdx].num : '35–38';
  audioBtn.setAttribute('title', playing ? `Pause recitation (${curNum})` : 'Play recitation · Sheikh Nasser Al-Qatami (74:35–38)');
}

function stopAllAudio() {
  if (audioAdvanceTimeout) {
    clearTimeout(audioAdvanceTimeout);
    audioAdvanceTimeout = null;
  }
  audioClips.forEach(a => {
    a.pause();
    a.currentTime = 0;
    a.onended = null;
  });
}

function playAudioAyah(idx) {
  stopAllAudio();
  currentAudioIdx = idx;
  const audio = audioClips[idx];
  if (!audio) return;
  audio.currentTime = 0;
  audio.play().then(() => {
    isAudioPlaying = true;
    updateAudioUI(true);
  }).catch(err => {
    console.warn('Audio play error:', err);
    isAudioPlaying = false;
    updateAudioUI(false);
  });

  audio.onended = () => {
    if (currentAudioIdx < AYAHS.length - 1) {
      audioAdvanceTimeout = setTimeout(() => {
        if (!isAudioPlaying) return;
        const nextIdx = currentAudioIdx + 1;
        displayStage(nextIdx, 0);
        playAudioAyah(nextIdx);
      }, 2200);
    } else {
      isAudioPlaying = false;
      updateAudioUI(false);
    }
  };
}

function toggleAudio() {
  if (isAudioPlaying) {
    stopAllAudio();
    isAudioPlaying = false;
    updateAudioUI(false);
  } else {
    const targetIdx = (currentAyahIdx >= 0 && currentAyahIdx < AYAHS.length) ? currentAyahIdx : 0;
    displayStage(targetIdx, 0);
    playAudioAyah(targetIdx);
  }
}

if (audioBtn) {
  audioBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleAudio();
  });
}

if (btnReplay) {
  btnReplay.addEventListener('click', () => {
    userInteracted = true;
    displayStage(currentAyahIdx, 0);
    if (isAudioPlaying) playAudioAyah(currentAyahIdx);
  });
}

if (btnFullVerse) {
  btnFullVerse.addEventListener('click', () => {
    userInteracted = true;
    displayStage(currentAyahIdx, AYAHS[currentAyahIdx].words.length);
  });
}

if (btnPrev) {
  btnPrev.addEventListener('click', () => {
    userInteracted = true;
    const prevIdx = (currentAyahIdx <= 0 ? AYAHS.length - 1 : currentAyahIdx - 1);
    displayStage(prevIdx, 0);
    if (isAudioPlaying) playAudioAyah(prevIdx);
  });
}

if (btnNext) {
  btnNext.addEventListener('click', () => {
    userInteracted = true;
    const nextIdx = (currentAyahIdx >= AYAHS.length - 1 ? 0 : currentAyahIdx + 1);
    displayStage(nextIdx, 0);
    if (isAudioPlaying) playAudioAyah(nextIdx);
  });
}

ayahPillBtns.forEach(pill => {
  pill.addEventListener('click', () => {
    userInteracted = true;
    const idx = parseInt(pill.getAttribute('data-idx'), 10);
    displayStage(idx, 0);
    if (isAudioPlaying) playAudioAyah(idx);
  });
});

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    const nextIdx = (currentAyahIdx >= AYAHS.length - 1 ? 0 : currentAyahIdx + 1);
    userInteracted = true;
    displayStage(nextIdx, 0);
    if (isAudioPlaying) playAudioAyah(nextIdx);
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    const prevIdx = (currentAyahIdx <= 0 ? AYAHS.length - 1 : currentAyahIdx - 1);
    userInteracted = true;
    displayStage(prevIdx, 0);
    if (isAudioPlaying) playAudioAyah(prevIdx);
  } else if (e.key === ' ' && e.target === document.body) {
    e.preventDefault();
    toggleAudio();
  }
});

function initApp() {
  size();
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || W < 768;
  const maxP = isMobile ? 850 : 3200;
  const minP = isMobile ? 480 : 1300;
  const targetP = Math.min(maxP, Math.max(minP, (W * H / (isMobile ? 520 : 320)) | 0));
  for (let i = targetP; i--; ) {
    P.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: 0,
      vy: 0,
      a: Math.random() * 7,
      w: .002 + Math.random() * .004,
      r: .95 + Math.random() * .1,
      s: 1.4 + Math.random() * 3,
      k: .6 + Math.random() * .8,
      c: Math.random() < .05 ? 3 : (Math.random() * 3) | 0
    });
  }
  now = performance.now();
  requestAnimationFrame(tick);

  const hash = location.hash.toLowerCase();
  if (hash.includes('snap') || hash.includes('full')) {
    document.body.classList.add('snap-mode');
    setTimeout(() => {
      displayStage(3, AYAHS[3].words.length, true);
    }, 150);
  } else if (hash.includes('35')) {
    setTimeout(() => displayStage(0, 0), 120);
  } else if (hash.includes('36')) {
    setTimeout(() => displayStage(1, 0), 120);
  } else if (hash.includes('37')) {
    setTimeout(() => displayStage(2, 0), 120);
  } else if (hash.includes('38')) {
    setTimeout(() => displayStage(3, 0), 120);
  } else {
    setTimeout(() => displayStage(0, 0), 120);
  }
}

if (document.fonts && document.fonts.ready) {
  Promise.race([
    document.fonts.ready,
    new Promise(res => setTimeout(res, 900))
  ]).then(initApp).catch(initApp);
} else {
  window.addEventListener('DOMContentLoaded', initApp);
}
</script>
